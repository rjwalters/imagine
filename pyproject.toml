[project]
name = "imagine"
version = "0.1.0"
description = "AI image generation CLI — Gemini (Nano Banana) and Cloudflare Workers AI backends, built as a renderer for agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Robb Walters" }]
dependencies = []

[project.scripts]
imagine = "imagine.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imagine"]
